name: Run Tests
##
# This github workflow is used to run tests on all commits to the master branch.
##

on:
  push:
    branches:
      - master
  pull_request: []

jobs:

  tests:
    name: Unit Tests

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: sudo ./run dependencies

      - name: Run Tests
        run: ./run tests
