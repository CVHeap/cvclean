[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'cvclean'
version = '0.0.0'
description = 'Remove potentially biasing PII/PHI from CVs without losing context'
readme = 'README.md'
license = 'GPL-3.0-or-later'
authors = [
    {name = 'CV Heap LLC'},
]
requires-python = '>=3.10'
dependencies = [
    'presidio-analyzer',
    'nameparser',
    'phonenumbers',
    'python-dateutil',
]

[project.optional-dependencies]
dev = [
    'flake8',
    'pylint',
    'pytest',
]

# The project root is the package directory
[tool.setuptools]
package-dir = {'cvclean' = '.'}
packages = ['cvclean', 'cvclean.filters']
